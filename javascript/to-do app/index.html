<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css">
  </head>
  <div class="app">
  <body>
    <div class="input-group">
      <input id="input" type="text" required placeholder="Enter what you want to purchase">
      <button class="btn">Add</button>

    <div class="filters">

    </div>

    <section class="content-container">
      <ul id="objects">
      </ul>
    </section>
    
    <script src="./script.js"></script>
  </body>
  </div>
</html>
